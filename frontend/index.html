<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AgentCall Desktop</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

  <!-- Screen: Setup (shown only when no API key) -->
  <div id="screen-setup" class="screen hidden">
    <div class="logo">🤖</div>
    <h1>AgentCall Desktop</h1>
    <p class="subtitle">Connect your account to get started</p>
    <div class="form-group">
      <label>API KEY</label>
      <input id="setup-apikey" type="password" placeholder="ak_ac_••••••••"/>
      <a href="https://app.agentcall.dev/login" target="_blank" class="link">
        → Get your key at app.agentcall.dev
      </a>
    </div>
    <div id="setup-error" class="error hidden"></div>
    <button id="setup-save" class="btn-primary">Save &amp; Continue</button>
    <button id="setup-back" class="btn-text hidden">← Back to Main Menu</button>

    <hr class="divider" />

    <div id="gemini-section">
      <h2 class="section-title">AI Brain (Gemini)</h2>
      <p class="hint">Add a Gemini API key to enable live meeting intelligence. Get one free at <a href="https://aistudio.google.com/app/apikey" target="_blank" class="link">aistudio.google.com</a>.</p>
      <div class="form-group">
        <label>GEMINI API KEY</label>
        <input id="gemini-apikey" type="password" placeholder="AIza…" autocomplete="off"/>
      </div>
      <div id="gemini-key-error" class="error hidden"></div>
      <button id="gemini-save" class="btn-primary">Save Gemini Key</button>
      <button id="gemini-clear" class="btn-text hidden">Remove Gemini Key</button>
    </div>
  </div>

  <!-- Screen: Join a Meeting -->
  <div id="screen-join" class="screen hidden">
    <div class="logo">🤖</div>
    <h1>Join a Meeting</h1>
    <div class="form-group">
      <label>MEETING URL</label>
      <input id="join-url" type="url" placeholder="https://meet.google.com/abc-def-ghi"/>
    </div>
    <div class="form-group">
      <label>BOT NAME</label>
      <input id="join-botname" type="text" placeholder="Juno"/>
    </div>
    <div class="form-group">
      <label>VOICE</label>
      <select id="join-voice">
        <option value="voice.heart">Heart (Female)</option>
        <option value="voice.bella">Bella (Female)</option>
        <option value="voice.echo">Echo (Male)</option>
        <option value="voice.eric">Eric (Male)</option>
      </select>
    </div>
    <button id="join-advanced-toggle" class="btn-advanced" aria-expanded="false">Advanced ▾</button>
    <div id="join-advanced" class="advanced-section">
      <div class="form-group">
        <label>TRIGGER WORDS <span class="hint">(comma-separated)</span></label>
        <input id="join-trigger" type="text" placeholder="juno, june"/>
      </div>
      <div class="form-group">
        <label>CONTEXT <span class="hint">(optional — what should the bot know?)</span></label>
        <textarea id="join-context" rows="3"
          placeholder="You are a helpful meeting assistant for Acme Corp..."></textarea>
      </div>
    </div>
    <div id="join-error" class="error hidden"></div>
    <button id="join-button" class="btn-primary">Join Meeting</button>
    <button id="join-settings" class="btn-text">⚙ Settings</button>
  </div>

  <!-- Screen: Active Call -->
  <div id="screen-call" class="screen hidden">
    <div id="call-status-bar" class="status-bar">
      <div id="call-status-indicator" class="status-indicator">
        <div id="call-status-dot" class="status-dot joining"></div>
      </div>
      <span id="call-status-text">Joining meeting...</span>
      <span id="gemini-chip" class="gemini-chip hidden">● Gemini</span>
    </div>
    <div id="call-feed" class="chat-feed">
      <span class="empty-hint">Conversation will appear here…</span>
    </div>
    <div id="call-warning" class="warning hidden"></div>
    <div class="bottom-row">
      <div id="call-participants" class="participants-strip"></div>
      <button id="call-leave" class="btn-leave">Leave</button>
    </div>
  </div>

  <script src="/wails.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
